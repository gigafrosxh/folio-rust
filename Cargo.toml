[workspace]
resolver = "2"
members = ["crates/folio-core", "crates/folio-app", "crates/folio-shell"]

[workspace.package]
version = "1.6.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1"
memmap2 = "0.9"
parking_lot = "0.12"
once_cell = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
